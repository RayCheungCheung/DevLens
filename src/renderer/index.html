<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevLens</title>
    <!--
      The shell loads its own local assets; remote content lives inside the <webview> guests,
      which run with nodeIntegration disabled and context isolation on.

      Search engines are inline SVG. Site shortcuts and custom engines use data-URL favicons
      resolved by the main process, so the shell needs no remote image host at all.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:*"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
